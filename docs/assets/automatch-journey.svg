<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Od kriterijuma do favorita u tri koraka</title>
  <desc id="desc">Prvi korak su filteri budžeta, goriva i menjača. Drugi korak je kartica vozila sa opcijama preskoči i sačuvaj. Treći korak je pregled sačuvanih vozila, njihovih detalja i dostupnosti pre rezervisanja. Svi prikazani podaci su ilustrativni.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="430" gradientUnits="userSpaceOnUse"><stop stop-color="#111d2b"/><stop offset="1" stop-color="#0d1621"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#354f55"/><stop offset="1" stop-color="#1f303b"/></linearGradient>
    <g id="car">
      <path d="m2 22 6-9 11-2 7-10h22l11 12 13 4 2 11H2Z" fill="#bfd8d4"/>
      <path d="m23 12 5-8h8v8Zm17-8h6l8 8H40Z" fill="#233e49"/>
      <circle cx="17" cy="27" r="7" fill="#0e1923" stroke="#93aaa9" stroke-width="2"/>
      <circle cx="59" cy="27" r="7" fill="#0e1923" stroke="#93aaa9" stroke-width="2"/>
    </g>
  </defs>
  <rect width="1280" height="430" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="43" fill="#97aabd" font-size="13" font-weight="650" letter-spacing="2">JEDNOSTAVAN PUT DO UŽEG IZBORA</text>
    <text x="1248" y="43" fill="#97aabd" font-size="12" text-anchor="end" letter-spacing="1">KONCEPT ISKUSTVA</text>

    <rect x="24" y="66" width="394" height="340" rx="18" fill="#172332" stroke="#314253"/>
    <rect x="443" y="66" width="394" height="340" rx="18" fill="#172332" stroke="#314253"/>
    <rect x="862" y="66" width="394" height="340" rx="18" fill="#172332" stroke="#314253"/>

    <text x="48" y="111" fill="#ff8e7f" font-size="15" font-weight="700" letter-spacing="1">01 / FILTRIRAJ</text>
    <text x="48" y="151" fill="#f3f6fa" font-size="29" font-weight="700" letter-spacing="-.6">Postavi svoje uslove.</text>
    <text x="48" y="182" fill="#b3c3d1" font-size="17">Ponuda počinje tvojim kriterijumima.</text>
    <rect x="48" y="211" width="346" height="160" rx="12" fill="#101b28" stroke="#334557"/>
    <text x="65" y="241" fill="#a8bbcd" font-size="15">Budžet</text>
    <text x="377" y="241" fill="#f1f5f9" font-size="17" font-weight="650" text-anchor="end">8.000–15.000 €</text>
    <path d="M67 266h309" stroke="#314354" stroke-width="5" stroke-linecap="round"/>
    <path d="M111 266h172" stroke="#ff8e7f" stroke-width="5" stroke-linecap="round"/>
    <circle cx="111" cy="266" r="7" fill="#ffb4a7"/><circle cx="283" cy="266" r="7" fill="#ffb4a7"/>
    <rect x="64" y="296" width="141" height="40" rx="9" fill="#263645"/>
    <rect x="216" y="296" width="162" height="40" rx="9" fill="#263645"/>
    <text x="134.5" y="322" fill="#d9e4ed" font-size="16" text-anchor="middle">Benzin</text>
    <text x="297" y="322" fill="#d9e4ed" font-size="16" text-anchor="middle">Manuelni</text>
    <text x="65" y="357" fill="#97aabd" font-size="12">Primer izabranih filtera</text>

    <text x="467" y="111" fill="#ff8e7f" font-size="15" font-weight="700" letter-spacing="1">02 / SWIPE</text>
    <text x="467" y="151" fill="#f3f6fa" font-size="29" font-weight="700" letter-spacing="-.6">Prepoznaj svoj stil.</text>
    <text x="467" y="182" fill="#b3c3d1" font-size="17">Jedna kartica. Jednostavan izbor.</text>
    <rect x="577" y="214" width="137" height="101" rx="12" fill="#203442" stroke="#415c6c" transform="rotate(7 645 265)"/>
    <rect x="563" y="207" width="146" height="108" rx="12" fill="url(#tile)" stroke="#6c8e94"/>
    <circle cx="678" cy="234" r="16" fill="#e49a7d"/>
    <use href="#car" x="597" y="247"/>
    <path d="M574 290h123" stroke="#a3b6b5" stroke-opacity=".4" stroke-dasharray="20 8"/>
    <path d="M542 261h-45m9-9-9 9 9 9" stroke="#ff9c91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M736 261h45m-9-9 9 9-9 9" stroke="#75e0c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="467" y="335" width="164" height="36" rx="9" fill="#342a34"/>
    <rect x="643" y="335" width="170" height="36" rx="9" fill="#183e35"/>
    <text x="549" y="359" fill="#ffafa5" font-size="16" text-anchor="middle">← Preskoči</text>
    <text x="728" y="359" fill="#a0f1d5" font-size="16" text-anchor="middle">Sačuvaj →</text>

    <text x="886" y="111" fill="#75e0c1" font-size="15" font-weight="700" letter-spacing="1">03 / FAVORITI</text>
    <text x="886" y="151" fill="#f3f6fa" font-size="29" font-weight="700" letter-spacing="-.6">Vrati se favoritima.</text>
    <text x="886" y="182" fill="#b3c3d1" font-size="17">Detalji i dostupnost pre rezervacije.</text>
    <rect x="886" y="211" width="346" height="68" rx="12" fill="#101b28" stroke="#334557"/>
    <rect x="898" y="222" width="70" height="46" rx="7" fill="url(#tile)"/>
    <use href="#car" transform="translate(902 234) scale(.8)"/>
    <text x="981" y="240" fill="#eaf1f7" font-size="16" font-weight="600">Gradski hatchback</text>
    <text x="981" y="262" fill="#75e0c1" font-size="14">Sačuvan · Dostupan</text>
    <rect x="886" y="290" width="346" height="68" rx="12" fill="#101b28" stroke="#334557"/>
    <rect x="898" y="301" width="70" height="46" rx="7" fill="url(#tile)"/>
    <use href="#car" transform="translate(902 313) scale(.8)"/>
    <text x="981" y="319" fill="#eaf1f7" font-size="16" font-weight="600">Porodični automobil</text>
    <text x="981" y="341" fill="#75e0c1" font-size="14">Sačuvan · Dostupan</text>
    <text x="886" y="384" fill="#97aabd" font-size="13">Favorit čuva izbor. Server potvrđuje rezervaciju.</text>
  </g>
