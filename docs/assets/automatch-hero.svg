    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e5f1ee"/><stop offset=".52" stop-color="#b6ceca"/><stop offset="1" stop-color="#7b9696"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#536f7b"/><stop offset="1" stop-color="#1d303c"/></linearGradient>
