  <title id="title">AutoMatch — Sledeći auto? Samo swipe.</title>
  <desc id="desc">Tamni promotivni baner sa koralnim i zelenim detaljima. Levo je opis aplikacije Tinder swipe za kola, a desno koncept mobilnog ekrana sa ilustracijom automobila i dugmadima za preskakanje i čuvanje. Podaci na ekranu su ilustrativni.</desc>
